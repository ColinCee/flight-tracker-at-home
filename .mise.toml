[tools]
bun = "1.4.4"
node = "26"
python = "3.14"
uv = "latest"

[settings]
python.uv_venv_auto = true

[env]
VIRTUAL_ENV = "{{config_root}}/apps/backend/.venv"

[tasks.setup]
description = "Install all dependencies (JS + Python) and git hooks"
run = """
bun install ${CI:+--frozen-lockfile}
cd apps/backend && uv sync
git config core.hooksPath .githooks
"""

[tasks.dev]
description = "Run frontend and backend together"
depends = ["dev:frontend", "dev:backend"]

[tasks."dev:frontend"]
description = "Run the Vite dev server on port 4200"
dir = "apps/frontend"
run = "bunx vite"

[tasks."dev:backend"]
description = "Run the API with auto-reload on port 8000"
dir = "apps/backend"
run = "uv run uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"

[tasks."setup:frontend"]
description = "Install frontend dependencies only"
run = "bun install"

[tasks."setup:backend"]
description = "Install backend dependencies only"
run = "cd apps/backend && uv sync"

[tasks.format]
description = "Format all code (ruff + biome)"
run = """
uvx ruff format apps/backend/
uvx ruff check --fix apps/backend/ || true
bunx biome format --write .
bunx biome lint --fix . || true
"""

[tasks.check]
description = "Lint, format, and type check (no modifications)"
run = """
uvx ruff check apps/backend/
uvx ruff format --check apps/backend/
bunx biome check .
cd apps/backend && uvx ty check
cd -
bunx tsc --build
"""

[tasks.test]
description = "Run all tests"
run = """
cd apps/backend && uv run pytest
cd {{config_root}}/apps/frontend && bunx vitest run
"""

[tasks.typecheck]
description = "Type check all code (subset of check)"
run = """
cd apps/backend && uvx ty check
cd -
bunx tsc --build
"""

[tasks."test:e2e"]
description = "Run Playwright end-to-end tests"
run = "cd apps/e2e && bunx playwright test"

[tasks."test:e2e:ui"]
description = "Run Playwright tests with interactive UI"
run = "cd apps/e2e && bunx playwright test --ui"

[tasks."test:e2e:prod"]
description = "Smoke-test a production build (vite build + preview) in Playwright"
run = "cd apps/e2e && bunx playwright test --config smoke/playwright.config.ts"

[tasks.codegen]
description = "Regenerate frontend API types from backend schema"
run = """
cd apps/backend && uv run python scripts/export_openapi.py
cd {{config_root}}
bunx orval --config orval.config.ts
"""

[tasks."codegen:check"]
description = "Check generated frontend types are in sync with backend schema"
run = """
cd apps/backend && uv run python scripts/export_openapi.py
cd {{config_root}}
bunx orval --config orval.config.ts
if ! git diff --quiet apps/frontend/openapi.json apps/frontend/src/api/generated.ts; then
  echo "ERROR: Generated API types are out of sync with backend schema"
  echo "Run: mise run codegen"
  git diff --stat apps/frontend/openapi.json apps/frontend/src/api/generated.ts
  exit 1
fi
echo "Generated API types are in sync"
"""

[tasks."rules:sync"]
description = "Regenerate AI config files from .rulesync/"
run = "npx rulesync@26.0.0 generate"

[tasks."rules:check"]
description = "Check AI config files are in sync with .rulesync/"
run = """
bash scripts/check-mise-docs-sync.sh
npx rulesync@26.0.0 generate
if ! git diff --quiet; then
  echo "ERROR: AI config files are out of sync with .rulesync/"
  echo "Run: mise run rules:sync"
  git diff --stat
  exit 1
fi
echo "AI config files are in sync"
"""

[tasks."deploy:frontend"]
description = "Build and deploy frontend to Cloudflare Pages"
dir = "apps/frontend"
run = [
  "bunx vite build",
  "bunx wrangler pages deploy dist --project-name=flight-tracker-at-home",
]

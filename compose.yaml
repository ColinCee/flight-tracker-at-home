# Runs the backend and a production frontend build in containers:
#   docker compose up
# Production runs the GHCR backend image from the homelab repo instead.

services:
  backend-dev:
    build:
      context: apps/backend
    ports:
      - "8000:8000"
    env_file:
      - apps/backend/.env

  frontend-dev:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: backend-dev:8000
    depends_on:
      - backend-dev

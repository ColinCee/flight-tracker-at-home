name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Format & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - run: mise run setup
      - run: mise run check
      - run: mise run codegen:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - run: mise run setup
      - run: mise run test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Chromium and its system libraries come in the image, so no run waits on Ubuntu's package mirror
    # (2 min for 32 MB at its slowest). The tag must match @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The container's user does not own the checkout, so git refuses it until told it is safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - run: mise run setup
      - run: mise run test:e2e
      - run: mise run test:e2e:prod
      - name: Speed budgets
        run: mise run test:speed

  # Keeps the name of a required check in the repo ruleset. Agent
  # instructions live only in AGENTS.md; a CLAUDE.md would make Claude Code skip it.
  rules-sync:
    name: Rules Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: test -s AGENTS.md && test ! -e CLAUDE.md
